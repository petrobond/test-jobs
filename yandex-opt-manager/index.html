<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Процесс «Обработка заказа» — BPMN AS-IS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 24px 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header .subtitle {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .legend {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 40px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #555;
    }

    .legend .lane-customer::before,
    .legend .lane-manager::before,
    .legend .lane-executor::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .legend .lane-customer::before  { background: #e8f5e9; border: 1px solid #81c784; }
    .legend .lane-manager::before   { background: #e3f2fd; border: 1px solid #64b5f6; }
    .legend .lane-executor::before  { background: #fff3e0; border: 1px solid #ffb74d; }
    .legend .gateway-marker         { color: #e65100; font-weight: 700; }

    #canvas {
      flex: 1;
      min-height: 650px;
      background: #fff;
      margin: 0;
    }

    .bjs-powered-by { display: none !important; }

    /* ── Lane colours ── */
    .customer-lane > .djs-visual > rect,
    .customer-lane rect { fill: #e8f5e9 !important; stroke: #2e7d32 !important; }
    .manager-lane > .djs-visual > rect,
    .manager-lane rect  { fill: #e3f2fd !important; stroke: #1565c0 !important; }
    .executor-lane > .djs-visual > rect,
    .executor-lane rect { fill: #fff3e0 !important; stroke: #ef6c00 !important; }

    /* ── Task colours ── */
    .customer-task > .djs-visual > rect,
    .customer-task rect { fill: #a5d6a7 !important; stroke: #2e7d32 !important; }
    .manager-task > .djs-visual > rect,
    .manager-task rect  { fill: #90caf9 !important; stroke: #1565c0 !important; }
    .executor-task > .djs-visual > rect,
    .executor-task rect { fill: #ffcc80 !important; stroke: #ef6c00 !important; }

    /* ── Event colours ── */
    .start-event > .djs-visual > circle,
    .start-event circle { fill: #c8e6c9 !important; stroke: #2e7d32 !important; }
    .end-event > .djs-visual > circle,
    .end-event circle   { fill: #ffcdd2 !important; stroke: #c62828 !important; }

    /* ── Gateway colours ── */
    .gateway > .djs-visual > polygon,
    .gateway > .djs-visual > path,
    .gateway polygon,
    .gateway path { fill: #ffe0b2 !important; stroke: #e65100 !important; }

    /* ── Labels ── */
    .djs-label,
    .djs-label text,
    .djs-label tspan {
      fill: #1a1a2e !important;
      font-weight: 500 !important;
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: #999;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    footer a { color: #0f3460; }
  </style>
</head>
<body>

  <header>
    <h1>📋 Процесс «Обработка заказа» — текущее состояние (AS-IS)</h1>
    <div class="subtitle">BPMN 2.0 · Участники: Заказчик, Менеджер, Исполнитель · Интерактивная схема</div>
  </header>

  <div class="legend">
    <span class="lane-customer">Заказчик</span>
    <span class="lane-manager">Менеджер</span>
    <span class="lane-executor">Исполнитель</span>
    <span class="gateway-marker">◆ Шлюз (решение)</span>
    <span style="color:#c62828;">⟲ Цикл корректировки</span>
  </div>

  <div id="canvas"></div>

  <footer>
    Тестовое задание · <a href="https://github.com/petrobond/test-jobs/tree/main/yandex-opt-manager">petrobond/test-jobs</a> ·
    Полный анализ — в <a href="https://github.com/petrobond/test-jobs/blob/main/yandex-opt-manager/README.md">README.md</a>
  </footer>

  <script src="https://unpkg.com/bpmn-js@17/dist/bpmn-viewer.development.js"></script>

  <script>
    const bpmnXML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL"
                  xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
                  xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
                  xmlns:di="http://www.omg.org/spec/DD/20100524/DI"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  id="Definitions_1"
                  targetNamespace="http://bpmn.io/schema/bpmn">

  <bpmn:collaboration id="Collaboration_1">
    <bpmn:participant id="Participant_Order" name="Обработка заказа" processRef="Process_Order" />
  </bpmn:collaboration>

  <bpmn:process id="Process_Order" name="Обработка заказа" isExecutable="false">

    <bpmn:laneSet id="LaneSet_1">
      <bpmn:lane id="Lane_Customer" name="Заказчик">
        <bpmn:flowNodeRef>StartEvent</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_FillForm</bpmn:flowNodeRef>
      </bpmn:lane>
      <bpmn:lane id="Lane_Manager" name="Менеджер">
        <bpmn:flowNodeRef>Task_Analyze</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Decompose</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Subtasks</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Check</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Gateway_Decision</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Gateway_Correction</bpmn:flowNodeRef>
      </bpmn:lane>
      <bpmn:lane id="Lane_Executor" name="Исполнитель">
        <bpmn:flowNodeRef>Task_Execute</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_Submit</bpmn:flowNodeRef>
      </bpmn:lane>
    </bpmn:laneSet>

    <bpmn:startEvent id="StartEvent" name="Потребность в услуге">
      <bpmn:outgoing>Flow_Start_to_Fill</bpmn:outgoing>
    </bpmn:startEvent>

    <bpmn:manualTask id="Task_FillForm" name="Заполнить форму&#10;заказа (вручную)">
      <bpmn:incoming>Flow_Start_to_Fill</bpmn:incoming>
      <bpmn:outgoing>Flow_Fill_to_Analyze</bpmn:outgoing>
    </bpmn:manualTask>

    <bpmn:userTask id="Task_Analyze" name="Получить заявку&#10;и проанализировать">
      <bpmn:incoming>Flow_Fill_to_Analyze</bpmn:incoming>
      <bpmn:outgoing>Flow_Analyze_to_Decompose</bpmn:outgoing>
    </bpmn:userTask>

    <bpmn:userTask id="Task_Decompose" name="Декомпозировать&#10;на услуги вручную">
      <bpmn:incoming>Flow_Analyze_to_Decompose</bpmn:incoming>
      <bpmn:incoming>Flow_Correction_to_Decompose</bpmn:incoming>
      <bpmn:outgoing>Flow_Decompose_to_Subtasks</bpmn:outgoing>
    </bpmn:userTask>

    <bpmn:userTask id="Task_Subtasks" name="Создать подзадачи,&#10;прописать ТЗ,&#10;передать исполнителям">
      <bpmn:incoming>Flow_Decompose_to_Subtasks</bpmn:incoming>
      <bpmn:outgoing>Flow_Subtasks_to_Execute</bpmn:outgoing>
    </bpmn:userTask>

    <bpmn:userTask id="Task_Execute" name="Выполнить задачу">
      <bpmn:incoming>Flow_Subtasks_to_Execute</bpmn:incoming>
      <bpmn:outgoing>Flow_Execute_to_Submit</bpmn:outgoing>
    </bpmn:userTask>

    <bpmn:userTask id="Task_Submit" name="Отдать на проверку&#10;менеджеру">
      <bpmn:incoming>Flow_Execute_to_Submit</bpmn:incoming>
      <bpmn:outgoing>Flow_Submit_to_Check</bpmn:outgoing>
    </bpmn:userTask>

    <bpmn:userTask id="Task_Check" name="Сверить план/факт">
      <bpmn:incoming>Flow_Submit_to_Check</bpmn:incoming>
      <bpmn:outgoing>Flow_Check_to_Gateway</bpmn:outgoing>
    </bpmn:userTask>

    <bpmn:exclusiveGateway id="Gateway_Decision" name="Решение">
      <bpmn:incoming>Flow_Check_to_Gateway</bpmn:incoming>
      <bpmn:outgoing>Flow_Gateway_to_End</bpmn:outgoing>
      <bpmn:outgoing>Flow_Gateway_to_Correction</bpmn:outgoing>
    </bpmn:exclusiveGateway>

    <bpmn:endEvent id="EndEvent" name="Заказ закрыт">
      <bpmn:incoming>Flow_Gateway_to_End</bpmn:incoming>
    </bpmn:endEvent>

    <bpmn:exclusiveGateway id="Gateway_Correction" name="Скорректировать&#10;список услуг">
      <bpmn:incoming>Flow_Gateway_to_Correction</bpmn:incoming>
      <bpmn:outgoing>Flow_Correction_to_Decompose</bpmn:outgoing>
    </bpmn:exclusiveGateway>

    <bpmn:sequenceFlow id="Flow_Start_to_Fill"       sourceRef="StartEvent"          targetRef="Task_FillForm" />
    <bpmn:sequenceFlow id="Flow_Fill_to_Analyze"      sourceRef="Task_FillForm"       targetRef="Task_Analyze" />
    <bpmn:sequenceFlow id="Flow_Analyze_to_Decompose" sourceRef="Task_Analyze"        targetRef="Task_Decompose" />
    <bpmn:sequenceFlow id="Flow_Decompose_to_Subtasks" sourceRef="Task_Decompose"     targetRef="Task_Subtasks" />
    <bpmn:sequenceFlow id="Flow_Subtasks_to_Execute"  sourceRef="Task_Subtasks"       targetRef="Task_Execute" />
    <bpmn:sequenceFlow id="Flow_Execute_to_Submit"    sourceRef="Task_Execute"        targetRef="Task_Submit" />
    <bpmn:sequenceFlow id="Flow_Submit_to_Check"      sourceRef="Task_Submit"         targetRef="Task_Check" />
    <bpmn:sequenceFlow id="Flow_Check_to_Gateway"     sourceRef="Task_Check"          targetRef="Gateway_Decision" />

    <bpmn:sequenceFlow id="Flow_Gateway_to_End"        sourceRef="Gateway_Decision"   targetRef="EndEvent">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">План = Факт</bpmn:conditionExpression>
    </bpmn:sequenceFlow>

    <bpmn:sequenceFlow id="Flow_Gateway_to_Correction"  sourceRef="Gateway_Decision"   targetRef="Gateway_Correction">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">План ≠ Факт</bpmn:conditionExpression>
    </bpmn:sequenceFlow>

    <bpmn:sequenceFlow id="Flow_Correction_to_Decompose" sourceRef="Gateway_Correction" targetRef="Task_Decompose" />
  </bpmn:process>

  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Collaboration_1">

      <bpmndi:BPMNShape id="Participant_Order_di" bpmnElement="Participant_Order" isHorizontal="true">
        <dc:Bounds x="40" y="40" width="1720" height="420" />
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Lane_Customer_di" bpmnElement="Lane_Customer" isHorizontal="true">
        <dc:Bounds x="70" y="40" width="1690" height="100" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="40" y="75" width="25" height="14" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Lane_Manager_di" bpmnElement="Lane_Manager" isHorizontal="true">
        <dc:Bounds x="70" y="140" width="1690" height="200" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="40" y="220" width="25" height="14" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Lane_Executor_di" bpmnElement="Lane_Executor" isHorizontal="true">
        <dc:Bounds x="70" y="340" width="1690" height="120" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="40" y="390" width="25" height="14" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="StartEvent_di" bpmnElement="StartEvent">
        <dc:Bounds x="112" y="62" width="36" height="36" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="93" y="105" width="75" height="27" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_FillForm_di" bpmnElement="Task_FillForm">
        <dc:Bounds x="220" y="50" width="130" height="60" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="228" y="68" width="115" height="28" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_Analyze_di" bpmnElement="Task_Analyze">
        <dc:Bounds x="420" y="185" width="130" height="60" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="428" y="203" width="115" height="28" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_Decompose_di" bpmnElement="Task_Decompose">
        <dc:Bounds x="620" y="175" width="130" height="80" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="628" y="201" width="115" height="30" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_Subtasks_di" bpmnElement="Task_Subtasks">
        <dc:Bounds x="820" y="175" width="130" height="80" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="828" y="186" width="115" height="60" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_Check_di" bpmnElement="Task_Check">
        <dc:Bounds x="1420" y="195" width="110" height="50" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="1425" y="208" width="100" height="28" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Gateway_Decision_di" bpmnElement="Gateway_Decision" isMarkerVisible="true">
        <dc:Bounds x="1585" y="270" width="40" height="40" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="1630" y="270" width="70" height="40" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="EndEvent_di" bpmnElement="EndEvent">
        <dc:Bounds x="1480" y="275" width="36" height="36" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="1455" y="315" width="85" height="14" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Gateway_Correction_di" bpmnElement="Gateway_Correction" isMarkerVisible="true">
        <dc:Bounds x="735" y="275" width="40" height="40" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="700" y="315" width="110" height="28" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_Execute_di" bpmnElement="Task_Execute">
        <dc:Bounds x="1040" y="360" width="130" height="50" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="1048" y="373" width="115" height="28" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNShape id="Task_Submit_di" bpmnElement="Task_Submit">
        <dc:Bounds x="1240" y="355" width="130" height="60" />
        <bpmndi:BPMNLabel>
          <dc:Bounds x="1248" y="368" width="115" height="28" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>

      <bpmndi:BPMNEdge id="Flow_Start_to_Fill_di" bpmnElement="Flow_Start_to_Fill">
        <di:waypoint x="148" y="80" />
        <di:waypoint x="220" y="80" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Fill_to_Analyze_di" bpmnElement="Flow_Fill_to_Analyze">
        <di:waypoint x="350" y="80" />
        <di:waypoint x="385" y="80" />
        <di:waypoint x="385" y="215" />
        <di:waypoint x="420" y="215" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Analyze_to_Decompose_di" bpmnElement="Flow_Analyze_to_Decompose">
        <di:waypoint x="550" y="215" />
        <di:waypoint x="620" y="215" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Decompose_to_Subtasks_di" bpmnElement="Flow_Decompose_to_Subtasks">
        <di:waypoint x="750" y="215" />
        <di:waypoint x="820" y="215" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Subtasks_to_Execute_di" bpmnElement="Flow_Subtasks_to_Execute">
        <di:waypoint x="950" y="235" />
        <di:waypoint x="975" y="235" />
        <di:waypoint x="975" y="385" />
        <di:waypoint x="1040" y="385" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Execute_to_Submit_di" bpmnElement="Flow_Execute_to_Submit">
        <di:waypoint x="1170" y="385" />
        <di:waypoint x="1240" y="385" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Submit_to_Check_di" bpmnElement="Flow_Submit_to_Check">
        <di:waypoint x="1370" y="385" />
        <di:waypoint x="1395" y="385" />
        <di:waypoint x="1395" y="220" />
        <di:waypoint x="1420" y="220" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Check_to_Gateway_di" bpmnElement="Flow_Check_to_Gateway">
        <di:waypoint x="1530" y="220" />
        <di:waypoint x="1605" y="220" />
        <di:waypoint x="1605" y="270" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Gateway_to_End_di" bpmnElement="Flow_Gateway_to_End">
        <di:waypoint x="1585" y="290" />
        <di:waypoint x="1516" y="293" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Gateway_to_Correction_di" bpmnElement="Flow_Gateway_to_Correction">
        <di:waypoint x="1605" y="310" />
        <di:waypoint x="1605" y="410" />
        <di:waypoint x="755" y="410" />
        <di:waypoint x="755" y="315" />
      </bpmndi:BPMNEdge>

      <bpmndi:BPMNEdge id="Flow_Correction_to_Decompose_di" bpmnElement="Flow_Correction_to_Decompose">
        <di:waypoint x="755" y="275" />
        <di:waypoint x="755" y="260" />
        <di:waypoint x="685" y="260" />
        <di:waypoint x="685" y="215" />
        <di:waypoint x="620" y="215" />
      </bpmndi:BPMNEdge>

    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>`;

    const viewer = new BpmnJS({ container: '#canvas' });

    viewer.importXML(bpmnXML)
      .then(result => {
        const warnings = result.warnings;
        if (warnings.length) console.warn('⚠ BPMN warnings:', warnings);

        const canvas = viewer.get('canvas');

        // viewport: показываем диаграмму от левого края
        canvas.viewbox({ x: 0, y: 30, width: 1780, height: 440 });

        // раскраска через маркеры
        const markers = {
          'customer-lane': ['Lane_Customer'],
          'manager-lane':  ['Lane_Manager'],
          'executor-lane': ['Lane_Executor'],
          'customer-task': ['Task_FillForm'],
          'manager-task':  ['Task_Analyze', 'Task_Decompose', 'Task_Subtasks', 'Task_Check'],
          'executor-task': ['Task_Execute', 'Task_Submit'],
          'start-event':   ['StartEvent'],
          'end-event':     ['EndEvent'],
          'gateway':       ['Gateway_Decision', 'Gateway_Correction']
        };

        Object.entries(markers).forEach(([cls, ids]) => {
          ids.forEach(id => { try { canvas.addMarker(id, cls); } catch (e) {} });
        });

        // Делаем подписи видимыми: снимаем инлайн-атрибуты SVG, которые скрывают текст,
        // и перемещаем .djs-label в конец DOM-дерева элемента для отрисовки поверх визуала
        document.querySelectorAll('#canvas .djs-element').forEach(function (el) {
          var children = el.children;
          var label = null;
          for (var i = 0; i < children.length; i++) {
            if (children[i].classList && children[i].classList.contains('djs-label')) {
              label = children[i];
              break;
            }
          }
          if (label) {
            // Принудительно устанавливаем fill на всех text/tspan внутри лейбла
            // (CSS !important не перекрывает инлайн-атрибуты SVG fill="none")
            var texts = label.querySelectorAll('text, tspan');
            for (var t = 0; t < texts.length; t++) {
              texts[t].setAttribute('fill', '#1a1a2e');
              texts[t].removeAttribute('visibility');
              texts[t].removeAttribute('opacity');
            }
            label.removeAttribute('visibility');
            // Перемещаем лейбл в конец — SVG рисует элементы по порядку в DOM
            el.appendChild(label);
          }
        });
      })
      .catch(err => {
        console.error('❌ Ошибка загрузки BPMN:', err);
        document.getElementById('canvas').innerHTML =
          '<div style="padding:60px;color:#c62828;font-size:18px;">⚠ Ошибка: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
